<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F1">
  <title>Cat Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="boot"><div class="boot-paw">🐾</div></div>
  </div>
  <nav id="tabs" hidden>
    <button data-tab="today"><span>🏠</span>Today</button>
    <button data-tab="health"><span>💉</span>Health</button>
    <button data-tab="history"><span>📖</span>History</button>
    <button data-tab="cats"><span>🐱</span>Cats</button>
  </nav>
  <div id="sheet-wrap" hidden>
    <div id="sheet-backdrop"></div>
    <div id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="config.js"></script>
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
